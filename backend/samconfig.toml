version = 0.1

[default.deploy.parameters]
stack_name = "yaadi-backend"
resolve_s3 = true
s3_prefix = "yaadi-backend"
region = "us-east-1"
confirm_changeset = true
capabilities = "CAPABILITY_IAM"
disable_rollback = true
parameter_overrides = "AllowedOrigins=\"https://yaadi.jaylabs.uk,http://localhost:5173,http://localhost:5174\""
image_repositories = []

[default.global.parameters]
region = "us-east-1"
